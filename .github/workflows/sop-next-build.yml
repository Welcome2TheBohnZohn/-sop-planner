name: SOP Next Build
on:
  push:
    branches:
      - rebuild/modular-webapp
    paths:
      - 'next/**'
      - '.github/workflows/sop-next-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
