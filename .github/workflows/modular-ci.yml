name: Modular SOP CI

on:
  push:
    branches:
      - rebuild/modular-webapp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build standalone preview
        run: node scripts/make-standalone.mjs
      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: sop-modular-standalone
          path: standalone/SOP_Planner_Modular_Standalone.html
          if-no-files-found: error
          retention-days: 7
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: sop-modular-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
